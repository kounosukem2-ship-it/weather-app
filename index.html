<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡単お天気アプリ</title>
    <!-- スマホでアプリっぽく表示するための設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="お天気アプリ">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: #white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 85%;
            max-width: 320px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2d3436;
        }
        .weather-info {
            font-size: 3rem;
            margin: 15px 0;
        }
        .temp {
            font-size: 1.8rem;
            font-weight: bold;
            color: #0984e3;
            margin-bottom: 20px;
        }
        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:active {
            background-color: #74b9ff;
        }
        .loading {
            font-size: 0.9rem;
            color: #b2bec3;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>東京の天気</h1>
        <div id="weatherEmoji" class="weather-info">🌤️</div>
        <div id="temperature" class="temp">--℃</div>
        <button onclick="fetchWeather()">最新の天気を取得</button>
        <div id="status" class="loading">ボタンを押して取得してね</div>
    </div>

    <script>
        async function fetchWeather() {
            const statusEl = document.getElementById("status");
            const tempEl = document.getElementById("temperature");
            const emojiEl = document.getElementById("weatherEmoji");

            statusEl.textContent = "データを取得中...";

            try {
                // 気象庁のオープンデータ（東京の天気予報API）からデータを取得
                const response = await fetch('https://www.jma.go.jp/bosai/forecast/data/forecast/130000.json');
                const data = await response.json();

                // 東京の天気データを抽出
                const weatherTitle = data[0].timeSeries[0].areas[0].weathers[0];
                
                tempEl.textContent = "東京エリア";
                emojiEl.textContent = "🗼";
                statusEl.textContent = weatherTitle;
            } catch (error) {
                statusEl.textContent = "取得に失敗しました";
                console.error(error);
            }
        }
    </script>

</body>
</html>
