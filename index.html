    <!-- 繝｢繝ｼ繝繝ｫ繧ｦ繧｣繝ｳ繝峨え -->
    <div id="weatherModal" class="modal">
        <div class="modal-content">
            <div id="modalLocation" class="modal-title">--</div>
            <div id="modalBody">
                <p style="text-align:center; color:#636e72;">繝・・繧ｿ繧定ｪｭ縺ｿ霎ｼ繧薙〒縺・∪縺・..</p>
            </div>
            <!-- Yahoo!螟ｩ豌励・蜈ｨ蝗ｽ繝医ャ繝励・繝ｼ繧ｸ縺ｫ遒ｺ螳溘↓鬟帙・繧医≧縺ｫ險ｭ螳・-->
            <a id="yahooLink" href="https://weather.yahoo.co.jp/weather/" target="_blank" class="yahoo-btn">&#57438;閥 Yahoo!螟ｩ豌励〒隧ｳ縺励￥隕九ｋ</a></div>
            <button class="close-btn" id="closeBtn">髢峨§繧具ｼ医・繧ｿ繝ｳ縺ｫ謌ｻ繧具ｼ・/button>

    <script>
        function parseWeatherCode(code) {
            const c = String(code);
            if (c.startsWith('1')) return '笘・・譎ｴ繧・;
            if (c.startsWith('2')) return '笘・ｸ・譖・ｊ';
            if (c.startsWith('3')) return '笘・髮ｨ';
            if (c.startsWith('4')) return '笘・ｸ・髮ｪ';
            return '&#57438;研・・譎ｴ繧・譖・ｊ';
        }

        function getOutfitAdvice(weatherText, maxT) {
            let advice = "&#57438;装 豌玲ｸｩ縺ｮ螟牙喧縺ｫ蟇ｾ蠢懊〒縺阪ｋ譛崎｣・′縺翫☆縺吶ａ縺ｧ縺吶・;
            if (maxT !== null && !isNaN(maxT)) {
                if (maxT >= 25) {
                    advice = "&#57438;装 <b>譛崎｣・</b> 25邃・ｒ雜・∴證代￥縺ｪ繧翫∪縺吶ょ濠陲悶ｄ豸ｼ縺励＞譛崎｣・′縺翫☆縺吶ａ縺ｧ縺吶・;
                } else if (maxT >= 20) {
                    advice = "&#57438;藻 <b>譛崎｣・</b> 驕弱＃縺励ｄ縺吶＞豌玲ｸｩ縺ｧ縺吶る聞陲悶・繧ｷ繝｣繝・↑縺ｩ縺後・縺｣縺溘ｊ縺ｧ縺吶・;
                } else if (maxT >= 15) {
                    advice = "&#57438;ｧ･ <b>譛崎｣・</b> 繧・ｄ閧悟ｯ偵＞縺ｧ縺吶ゅき繝ｼ繝・ぅ繧ｬ繝ｳ繧・ず繝｣繧ｱ繝・ヨ繧堤畑諢上＠縺ｾ縺励ｇ縺・・;
                } else {
                    advice = "&#57438;ｧ｣ <b>譛崎｣・</b> 15邃・ｻ･荳九〒蜀ｷ縺郁ｾｼ縺ｿ縺ｾ縺吶ゅさ繝ｼ繝医ｄ蜴壽焔縺ｮ繧ｸ繝｣繧ｱ繝・ヨ縺悟ｿ・ｦ√〒縺吶・;
                }
            }
            if (weatherText.includes('髮ｨ')) {
                advice += "<br>笘・蛯倥ｒ縺頑戟縺｡縺上□縺輔＞縲・;
            }
            return advice;
        }

        async function getWeather(officeCode, prefName) {
            const modal = document.getElementById("weatherModal");
            const modalTitle = document.getElementById("modalLocation");
            const modalBody = document.getElementById("modalBody");

            modalTitle.textContent = prefName + "縺ｮ螟ｩ豌嶺ｺ亥&#63728;ｱ";
            modalBody.innerHTML = '<p style="text-align:center; color:#636e72;">繝・・繧ｿ繧貞叙蠕嶺ｸｭ...</p>';
            modal.style.display = "flex";

            try {
                const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${officeCode}.json`);
                if (!res.ok) throw new Error("騾壻ｿ｡繧ｨ繝ｩ繝ｼ");
                
                const data = await res.json();
                let html = "";

                if (data && data[0] && data[0].timeSeries) {
                    const ts = data[0].timeSeries;
                    const times = ts[0]?.timeDefines || [];
                    const weathers = ts[0]?.areas[0]?.weathers || [];
                    const pops = ts[1]?.areas[0]?.pops || [];
                    
                    let minTemp = "--";
                    let maxTemp = "--";
                    let maxTNum = null;

                    if (ts[2] && ts[2].areas && ts[2].areas[0] && ts[2].areas[0].temps) {
                        const temps = ts[2].areas[0].temps;
                        if (temps.length >= 2) {
                            minTemp = temps[0];
                            maxTemp = temps[1];
                            maxTNum = parseFloat(temps[1]);
                        } else if (temps.length === 1) {
                            maxTemp = temps[0];
                            maxTNum = parseFloat(temps[0]);
                        }
                    }

                    html += `<div style="font-weight:bold; margin-bottom:8px; color:#2d3436; font-size:0.95rem;">&#57438;研・・莉頑律縺ｮ螟ｩ豌・/div>`;

                    for (let i = 0; i < Math.min(times.length, 1); i++) {
                        const d = new Date(times[i]);
                        const dateStr = `${d.getMonth() + 1}/${d.getDate()} (${['譌･','譛・,'轣ｫ','豌ｴ','譛ｨ','驥・,'蝨・][d.getDay()]})`;
                        const wText = weathers[i] ? weathers[i].replace(/\s+/g, '') : "譎ｴ繧・;
                        const popVal = pops[i] !== undefined && pops[i] !== "" ? `${pops[i]}%` : '--%';

                        html += `
                            <div class="info-card">
                                <div style="font-weight:bold; color:#0984e3; margin-bottom:6px;">${dateStr}</div>
                                <div class="info-row"><span>螟ｩ豌・/span><span style="font-weight:bold;">${wText}</span></div>
                                <div class="info-row"><span>譛鬮俶ｰ玲ｸｩ</span><span class="temp-max">&#57438;牽・・${maxTemp}邃・/span></div>
                                <div class="info-row"><span>譛菴取ｰ玲ｸｩ</span><span class="temp-min">笶・ｸ・${minTemp}邃・/span></div>
                                <div class="info-row"><span>髯肴ｰｴ遒ｺ邇・/span><span>&#57438;挑 ${popVal}</span></div>
                                <div class="outfit-box">${getOutfitAdvice(wText, maxTNum)}</div>
                            </div>
                        `;
                    }
                }

                if (data && data.length > 1 && data[1] && data[1].timeSeries) {
                    const wTs = data[1].timeSeries[0];
                    const times = wTs?.timeDefines || [];
                    const codes = wTs?.areas[0]?.weatherCodes || [];

                    html += `<div style="font-weight:bold; margin: 15px 0 8px 0; color:#2d3436; font-size:0.95rem;">&#57438;套 騾ｱ髢灘､ｩ豌嶺ｺ亥&#63728;ｱ</div>`;
                    html += `<div class="info-card">`;
                    for (let i = 0; i < times.length; i++) {
                        const d = new Date(times[i]);
                        const dateStr = `${d.getMonth() + 1}/${d.getDate()} (${['譌･','譛・,'轣ｫ','豌ｴ','譛ｨ','驥・,'蝨・][d.getDay()]})`;
                        const wText = codes[i] ? parseWeatherCode(codes[i]) : "笘・・譎ｴ繧・;

                        html += `
                            <div class="info-row" style="border-bottom:1px dashed #eee; padding:6px 0;">
                                <span style="font-weight:bold;">${dateStr}</span>
                                <span>${wText}</span>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }

                modalBody.innerHTML = html;

            } catch (err) {
                console.error(err);
                modalBody.innerHTML = '<p style="text-align:center; color:#e74c3c;">繝・・繧ｿ縺ｮ蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆縲・br>荳九・縲刑ahoo!螟ｩ豌励阪・繧ｿ繝ｳ縺九ｉ縺皮｢ｺ隱阪￥縺&#63728;縺輔＞縲・/p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.p-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const code = btn.getAttribute('data-code');
                    const name = btn.getAttribute('data-name');
                    getWeather(code, name);
                });
            });

            document.getElementById('closeBtn').addEventListener('click', () => {
                document.getElementById('weatherModal').style.display = 'none';
            });
        });
    </script>
